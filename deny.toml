# Dependency policy supplements the separate RustSec advisory gate.
[graph]
all-features = true

[licenses]
confidence-threshold = 1.0
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[licenses.private]
# This unpublished application has no declared distribution license. Check the
# third-party dependency licenses without assigning a license to private code.
ignore = true

# Reviewed licenses for the pinned TLS/cryptography stack and Mozilla root data.
# Keep approvals package/version-specific; the general allowlist stays closed.
[[licenses.exceptions]]
name = "aws-lc-rs"
version = "=1.19.0"
allow = ["ISC"]

[[licenses.exceptions]]
name = "aws-lc-sys"
version = "=0.47.0"
allow = ["ISC", "BSD-3-Clause"]

[[licenses.exceptions]]
name = "rustls-webpki"
version = "=0.103.16"
allow = ["ISC"]

[[licenses.exceptions]]
name = "subtle"
version = "=2.6.1"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "untrusted"
version = "=0.9.0"
allow = ["ISC"]

[[licenses.exceptions]]
name = "webpki-roots"
version = "=1.0.11"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
