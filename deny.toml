# Dependency policy supplements the separate RustSec advisory gate.
[graph]
all-features = true

[licenses]
confidence-threshold = 1.0
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]

[licenses.private]
# This unpublished application has no declared distribution license. Check the
# third-party dependency licenses without assigning a license to private code.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
