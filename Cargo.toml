[package]
name = "day2-cli"
version = "0.4.1"
edition = "2024"
rust-version = "1.98"
description = "The Rust command-line interface for Day 2"
repository = "https://github.com/clankernative/cli"
publish = false

[[bin]]
name = "day2"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "~4.5.67"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
base64 = "0.23"
keyring-core = "1.0"
aws-lc-rs = { version = "1.19", default-features = false, features = ["alloc", "non-fips"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
form_urlencoded = "1.2"
zeroize = "1.9"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust", "vendored"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["signal", "process", "user"] }
signal-hook = "0.3"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Deliberate restrictions, rather than the contradictory full restriction group.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
exit = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
as_conversions = "deny"
allow_attributes = "deny"
